
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Preparar arquivos web
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android
      - name: Configurar ícone do aplicativo
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
                  
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Sincronizar
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

         - name: Restaurar chave de assinatura
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/viagens29-release.keystore

      - name: Gerar APK release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Assinar APK
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -v -p 4 \
          android/app/build/outputs/apk/release/app-release-unsigned.apk \
          android/app/build/outputs/apk/release/Horas-Viagens29-release.apk

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
          --ks android/app/viagens29-release.keystore \
          --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
          --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
          --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
          android/app/build/outputs/apk/release/Horas-Viagens29-release.apk

      - name: Verificar assinatura
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose \
          android/app/build/outputs/apk/release/Horas-Viagens29-release.apk

      - name: Publicar APK release
        uses: actions/upload-artifact@v4
        with:
          name: Horas-Viagens29-Release
          path: android/app/build/outputs/apk/release/Horas-Viagens29-release.apk
